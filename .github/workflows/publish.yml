name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pokerutils

    permissions:
      # Required for PyPI Trusted Publishing; no API token is stored in the repo.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
