[project]
name = "pokerutils"
version = "0.1.0"
description = "A terminal trainer for Texas Hold'em: read hands street by street, count outs, and practise pot odds at a six-seat table"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Markos Narinian" }]
keywords = [
    "poker",
    "texas-holdem",
    "pot-odds",
    "trainer",
    "tui",
    "terminal",
    "textual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Education",
]
dependencies = [
    "platformdirs>=4.10.0",
    "pokerkit>=0.7.4,<0.8",
    "textual>=8.2.8",
]

[dependency-groups]
dev = ["ruff>=0.16.8"]

[project.urls]
Homepage = "https://github.com/markosnarinian/pokerutils"
Repository = "https://github.com/markosnarinian/pokerutils"
Issues = "https://github.com/markosnarinian/pokerutils/issues"

[project.scripts]
pokerutils = "pokerutils.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerutils"]

# The home screen renders the README, so ship a copy inside the installed package.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pokerutils/README.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
